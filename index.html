<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR 디버그</title>
<script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
<style>
body{font-family:sans-serif;padding:20px;background:#111;color:#fff}
textarea{width:100%;height:200px;background:#222;color:#0f0;font-size:11px;padding:8px}
button{padding:12px 24px;background:#4ECDC4;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:10px;width:100%}
.upload-zone{border:2px dashed #444;border-radius:12px;padding:20px;text-align:center;margin-bottom:10px;cursor:pointer;position:relative}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
img{max-width:100%;max-height:200px;margin-top:8px;border-radius:8px}
</style>
</head>
<body>
<h2>📸 인스타 OCR 디버그</h2>
<div class="upload-zone">
  <input type="file" accept="image/*" id="f" onchange="load(this)">
  <div>이미지 업로드</div>
  <img id="preview" style="display:none">
</div>
<button onclick="run()">OCR 실행</button>
<h3 style="margin-top:16px">결과:</h3>
<textarea id="out">여기에 결과 나와요...</textarea>

<script>
let dataUrl=null;
function load(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    dataUrl=e.target.result;
    const img=document.getElementById('preview');
    img.src=dataUrl;img.style.display='block';
  };
  reader.readAsDataURL(file);
}
async function run(){
  if(!dataUrl){alert('이미지 먼저!');return;}
  document.getElementById('out').value='분석 중...';
  const result=await Tesseract.recognize(dataUrl,'kor+eng',{logger:()=>{}});
  const words=result.data.words;
  const imgH=words.reduce((max,w)=>Math.max(max,w.bbox.y1),0)||1000;
  let out='imgH='+imgH+'\n\n';
  out+='=== 전체 단어 목록 ===\n';
  words.forEach(w=>{
    const y=((w.bbox.y0+w.bbox.y1)/2/imgH).toFixed(3);
    out+=`y:${y} | '${w.text}'\n`;
  });
  // mergeNearbyWords
  const lines=[];const used=new Set();
  const sorted=[...words].sort((a,b)=>(a.bbox.y0+a.bbox.y1)/2-(b.bbox.y0+b.bbox.y1)/2);
  for(let i=0;i<sorted.length;i++){
    if(used.has(i))continue;
    const base=sorted[i];const baseY=(base.bbox.y0+base.bbox.y1)/2/imgH;
    const group=[base];used.add(i);
    for(let j=i+1;j<sorted.length;j++){
      if(used.has(j))continue;
      const cmp=sorted[j];const cmpY=(cmp.bbox.y0+cmp.bbox.y1)/2/imgH;
      if(Math.abs(cmpY-baseY)<0.03){group.push(cmp);used.add(j);}
    }
    group.sort((a,b)=>a.bbox.x0-b.bbox.x0);
    lines.push({text:group.map(w=>w.text).join(''),yRatio:baseY});
  }
  out+='\n=== 합쳐진 줄 ===\n';
  lines.forEach(l=>out+=`y:${l.yRatio.toFixed(3)} | '${l.text}'\n`);
  document.getElementById('out').value=out;
}
</script>
</body>
</html>
